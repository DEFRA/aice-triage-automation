name: Check Pull Request

on:
  pull_request:
    branches:
      - main
      - minimal
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  security-scan:
    name: Security Scanning
    uses: ./.github/workflows/scan.yml
    secrets: inherit

  pr-validator:
    name: Run Pull Request Checks
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Security audit
        run: npm run security-audit

      - run: |
          npm ci
          npm run format:check
          npm run lint

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag cdp-node-backend-template .
          exit $?

      - name: Bedrock classify integration
        if: vars.RUN_BEDROCK_INTEGRATION == 'true'
        env:
          RUN_BEDROCK_INTEGRATION: 'true'
          BEDROCK_REGION: eu-west-2
          BEDROCK_CLASSIFY_MODEL_ID: ${{ vars.BEDROCK_CLASSIFY_MODEL_ID }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
        run: npx vitest run tests/integration/engine-bedrock.classify.integration.test.js

      - name: Upload acceptance logs
        if: vars.RUN_BEDROCK_INTEGRATION == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-logs
          path: acceptance-logs/
